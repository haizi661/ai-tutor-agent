[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor-agent"
version = "0.1.0"
description = "Adaptive tutoring multi-agent workflow built on LangGraph."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=0.2.0",
  "langchain>=0.1.0",
  "langchain-core>=0.1.0",
  "langchain-community>=0.0.1",
  "langchain-google-genai>=2.0.0",
  "langchain-huggingface>=0.1.0",
  "langchain-openai>=0.1.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24.0",
  "sentence-transformers>=3.0.0",
  "langchain-chroma>=0.2.0",
  "chromadb>=0.5.0",
  "httpx[socks]>=0.28.1",
  "uvicorn>=0.30.0",
  "rank-bm25>=0.2.0",
  "dashscope>=1.0.0",
  "openai>=1.0.0",
  "pydantic>=2.0.0",
  "tf-keras>=2.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[project.scripts]
ai-tutor-agent = "main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_tutor_agent*"]
